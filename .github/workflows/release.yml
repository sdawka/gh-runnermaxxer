name: release
on:
  push:
    tags:
      - "v*"

# The default GITHUB_TOKEN is read-only; goreleaser needs contents:write to
# create the release and upload the archives.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(grep -h -m1 '^const Version = ' internal/engine/*.go | cut -d'"' -f2)"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::tag v$tag does not match engine.Version=$version" >&2
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
