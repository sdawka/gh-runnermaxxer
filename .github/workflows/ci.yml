name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: go test -tags integration ./...

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check
      - name: Version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(grep -h -m1 '^const Version = ' internal/engine/*.go | cut -d'"' -f2)"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::tag v$tag does not match engine.Version=$version" >&2
            exit 1
          fi
